<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>销售轮接系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
         background: #f5f5f5; min-height: 100vh; }

  /* ── 设置页 ── */
  #setup-page { display:flex; flex-direction:column; align-items:center;
    justify-content:center; min-height:100vh; padding:24px; }
  #setup-page h2 { font-size:20px; margin-bottom:16px; color:#333; }
  #setup-page input { width:100%; max-width:400px; padding:12px 16px;
    border:1px solid #ddd; border-radius:10px; font-size:15px; margin-bottom:12px; }
  #setup-page button { width:100%; max-width:400px; padding:14px;
    background:#1677ff; color:#fff; border:none; border-radius:10px;
    font-size:16px; font-weight:600; cursor:pointer; }
  #setup-page .hint { font-size:13px; color:#999; margin-top:16px; text-align:center; line-height:1.6; }

  /* ── 主页 ── */
  #main-page { display:none; flex-direction:column; min-height:100vh; }
  .top-bar { background:#fff; padding:14px 16px; display:flex;
    justify-content:space-between; align-items:center;
    border-bottom:1px solid #eee; position:sticky; top:0; z-index:10; }
  .top-bar h1 { font-size:17px; font-weight:700; color:#1a1a1a; }
  .top-bar .admin-btn { font-size:13px; color:#999; cursor:pointer; padding:4px 10px;
    border:1px solid #ddd; border-radius:20px; }

  .next-card { margin:16px; background:#1677ff; border-radius:16px;
    padding:20px; color:#fff; text-align:center; }
  .next-label { font-size:13px; opacity:.8; margin-bottom:6px; }
  .next-name { font-size:28px; font-weight:700; margin-bottom:4px; }
  .next-sub { font-size:13px; opacity:.75; }
  .receive-btn { margin:0 16px 16px; background:#fff; border:2px solid #1677ff;
    color:#1677ff; font-size:20px; font-weight:700; padding:18px;
    border-radius:14px; width:calc(100% - 32px); cursor:pointer;
    transition:all .15s; }
  .receive-btn:active { background:#e6f0ff; transform:scale(.97); }

  .section-title { padding:8px 16px; font-size:13px; color:#999; font-weight:600; }
  .sale-list { padding:0 16px 16px; display:flex; flex-direction:column; gap:10px; }
  .sale-card { background:#fff; border-radius:14px; padding:14px 16px;
    display:flex; align-items:center; gap:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .sale-rank { width:28px; height:28px; border-radius:50%; background:#f0f0f0;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; color:#666; flex-shrink:0; }
  .sale-rank.top1 { background:#FFD700; color:#fff; }
  .sale-rank.top2 { background:#C0C0C0; color:#fff; }
  .sale-rank.top3 { background:#CD7F32; color:#fff; }
  .sale-info { flex:1; }
  .sale-name { font-size:16px; font-weight:600; color:#1a1a1a; }
  .sale-meta { font-size:12px; color:#999; margin-top:2px; }
  .sale-badge { font-size:11px; padding:2px 8px; border-radius:20px;
    font-weight:600; flex-shrink:0; }
  .badge-rest { background:#fff3e0; color:#f57c00; }
  .badge-active { background:#e8f5e9; color:#388e3c; }
  .badge-next { background:#e3f0ff; color:#1677ff; }

  .log-section { margin:0 16px 16px; background:#fff; border-radius:14px;
    padding:14px 16px; }
  .log-section h3 { font-size:14px; font-weight:700; color:#333; margin-bottom:10px; }
  .log-item { font-size:13px; color:#666; padding:5px 0;
    border-bottom:1px solid #f5f5f5; display:flex; justify-content:space-between; }
  .log-item:last-child { border-bottom:none; }
  .log-empty { font-size:13px; color:#ccc; text-align:center; padding:12px 0; }

  /* ── 管理面板 ── */
  #admin-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5);
    z-index:100; align-items:flex-end; }
  #admin-modal.open { display:flex; }
  .admin-panel { background:#fff; width:100%; border-radius:20px 20px 0 0;
    padding:20px; max-height:85vh; overflow-y:auto; }
  .admin-panel h2 { font-size:18px; font-weight:700; margin-bottom:16px;
    display:flex; justify-content:space-between; align-items:center; }
  .admin-panel h2 span { font-size:22px; cursor:pointer; color:#999; }
  .admin-section { margin-bottom:20px; }
  .admin-section h3 { font-size:14px; color:#666; margin-bottom:10px; font-weight:600; }
  .admin-row { display:flex; gap:8px; margin-bottom:8px; }
  .admin-row input { flex:1; padding:10px 12px; border:1px solid #eee;
    border-radius:10px; font-size:14px; }
  .admin-row button, .admin-btn-full { padding:10px 16px; border:none;
    border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; }
  .admin-btn-full { width:100%; margin-top:4px; padding:12px; }
  .btn-primary { background:#1677ff; color:#fff; }
  .btn-danger  { background:#ff4d4f; color:#fff; }
  .btn-warn    { background:#fa8c16; color:#fff; }
  .btn-gray    { background:#f5f5f5; color:#666; }
  .sale-mgr-item { display:flex; align-items:center; gap:8px; padding:8px 0;
    border-bottom:1px solid #f5f5f5; }
  .sale-mgr-item:last-child { border-bottom:none; }
  .sale-mgr-name { flex:1; font-size:14px; }
  .beds-ctrl { display:flex; align-items:center; gap:6px; }
  .beds-ctrl button { width:28px; height:28px; border:1px solid #ddd;
    border-radius:8px; background:#fff; font-size:16px; cursor:pointer; }
  .beds-ctrl span { min-width:24px; text-align:center; font-size:14px; font-weight:600; }

  /* ── 密码输入 ── */
  #pwd-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5);
    z-index:200; align-items:center; justify-content:center; }
  #pwd-modal.open { display:flex; }
  .pwd-box { background:#fff; border-radius:16px; padding:24px; width:280px;
    text-align:center; }
  .pwd-box h3 { margin-bottom:16px; font-size:17px; }
  .pwd-box input { width:100%; padding:12px; border:1px solid #eee;
    border-radius:10px; font-size:18px; text-align:center; letter-spacing:6px;
    margin-bottom:12px; }
  .pwd-box .row { display:flex; gap:8px; }
  .pwd-box .row button { flex:1; padding:12px; border:none; border-radius:10px;
    font-size:15px; font-weight:600; cursor:pointer; }

  .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.75); color:#fff; padding:10px 20px; border-radius:24px;
    font-size:14px; display:none; z-index:999; white-space:nowrap; }
</style>
</head>
<body>

<!-- 设置页 -->
<div id="setup-page">
  <h2>🔗 连接数据库</h2>
  <input id="db-url-input" type="url" placeholder="Firebase 数据库 URL，例如：https://xxx.firebaseio.com">
  <button onclick="saveDbUrl()">开始使用</button>
  <p class="hint">首次使用需要填写 Firebase 实时数据库地址<br>之后会自动记住，无需重复填写<br><br>
    <b>创建方法：</b>前往 console.firebase.google.com<br>新建项目 → Realtime Database → 获取 URL</p>
</div>

<!-- 主页 -->
<div id="main-page">
  <div class="top-bar">
    <h1>销售轮接系统</h1>
    <div class="admin-btn" onclick="openPwd()">管理</div>
  </div>

  <div class="next-card">
    <div class="next-label">下一位接待</div>
    <div class="next-name" id="next-name">加载中…</div>
    <div class="next-sub" id="next-sub"></div>
  </div>

  <button class="receive-btn" onclick="receiveCustomer()">✅ 接待客户</button>

  <div class="section-title">今日轮接顺序（按业绩排列）</div>
  <div class="sale-list" id="sale-list"></div>

  <div class="log-section">
    <h3>今日接待记录</h3>
    <div id="log-list"><div class="log-empty">暂无记录</div></div>
  </div>
</div>

<!-- 密码弹窗 -->
<div id="pwd-modal">
  <div class="pwd-box">
    <h3>请输入管理密码</h3>
    <input id="pwd-input" type="password" maxlength="20" placeholder="••••••">
    <div class="row">
      <button class="btn-gray" onclick="closePwd()">取消</button>
      <button class="btn-primary" onclick="checkPwd()">确认</button>
    </div>
  </div>
</div>

<!-- 管理面板 -->
<div id="admin-modal">
  <div class="admin-panel">
    <h2>管理面板 <span onclick="closeAdmin()">✕</span></h2>

    <div class="admin-section">
      <h3>销售人员管理</h3>
      <div id="mgr-list"></div>
      <div class="admin-row" style="margin-top:12px;">
        <input id="new-name" placeholder="姓名" style="max-width:100px;">
        <input id="new-beds" type="number" placeholder="床位数" min="0" style="max-width:90px;">
        <button class="btn-primary" onclick="addSale()">添加</button>
      </div>
    </div>

    <div class="admin-section">
      <h3>重置今日数据</h3>
      <button class="admin-btn-full btn-warn" onclick="resetDaily()">重置今日接待次数</button>
    </div>

    <div class="admin-section">
      <h3>修改管理密码</h3>
      <div class="admin-row">
        <input id="new-pwd" type="password" placeholder="新密码">
        <button class="btn-primary" onclick="changePwd()">修改</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase 8 SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
// ── 初始数据 ──────────────────────────────────────────
const INIT_SALES = [
  { name:"毛晓勤", beds:6, received:0, resting:false },
  { name:"李琴",   beds:6, received:0, resting:false },
  { name:"阮荣清", beds:4, received:0, resting:false },
  { name:"赵东珏", beds:3, received:0, resting:false },
  { name:"刘玲花", beds:3, received:0, resting:false },
];

// ── 状态 ──────────────────────────────────────────────
let db = null;
let sales = {};
let logItems = [];
let adminPwd = "888888";
let adminUnlocked = false;

// ── Firebase 初始化 ────────────────────────────────────
function initFirebase(dbUrl) {
  if (!firebase.apps.length) {
    firebase.initializeApp({
      databaseURL: dbUrl.trim().replace(/\/$/, "")
    });
  }
  db = firebase.database();
  startListeners();
}

function startListeners() {
  const today = todayStr();

  // 初始化（若无数据则写入）
  db.ref("config/date").once("value").then(snap => {
    if (!snap.val()) {
      db.ref("config/date").set(today);
      db.ref("config/pwd").set(adminPwd);
      const initObj = {};
      INIT_SALES.forEach((s, i) => { initObj["s" + i] = s; });
      db.ref("sales").set(initObj);
    } else if (snap.val() !== today) {
      // 新的一天 → 重置接待次数
      db.ref("sales").once("value").then(ss => {
        const updates = {};
        ss.forEach(child => {
          updates["sales/" + child.key + "/received"] = 0;
        });
        updates["config/date"] = today;
        db.ref().update(updates);
      });
    }
  });

  // 实时监听销售数据
  db.ref("sales").on("value", snap => {
    sales = {};
    snap.forEach(child => { sales[child.key] = child.val(); });
    renderSales();
  });

  // 实时监听今日日志
  db.ref("log/" + today).on("value", snap => {
    logItems = [];
    snap.forEach(child => { logItems.push(child.val()); });
    logItems.reverse();
    renderLog();
  });

  // 读取密码
  db.ref("config/pwd").on("value", snap => {
    if (snap.val()) adminPwd = snap.val();
  });
}

// ── 工具 ──────────────────────────────────────────────
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function sorted() {
  return Object.entries(sales)
    .map(([k, v]) => ({ key: k, ...v }))
    .sort((a, b) => b.beds - a.beds || a.received - b.received);
}

function nextActive() {
  return sorted().find(s => !s.resting) || null;
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 2200);
}

// ── 渲染 ──────────────────────────────────────────────
function renderSales() {
  const list = sorted();
  const next = nextActive();

  // 更新顶部卡片
  if (next) {
    document.getElementById("next-name").textContent = next.name;
    document.getElementById("next-sub").textContent =
      `已成交 ${next.beds} 张床位 · 今日已接 ${next.received} 位`;
  } else {
    document.getElementById("next-name").textContent = "全员休息中";
    document.getElementById("next-sub").textContent = "";
  }

  // 销售列表
  const container = document.getElementById("sale-list");
  container.innerHTML = "";
  list.forEach((s, i) => {
    const isNext = next && s.key === next.key;
    const rankClass = i === 0 ? "top1" : i === 1 ? "top2" : i === 2 ? "top3" : "";
    const badge = s.resting
      ? `<span class="sale-badge badge-rest">休息</span>`
      : isNext
      ? `<span class="sale-badge badge-next">下一位</span>`
      : `<span class="sale-badge badge-active">轮接中</span>`;

    const card = document.createElement("div");
    card.className = "sale-card";
    card.innerHTML = `
      <div class="sale-rank ${rankClass}">${i + 1}</div>
      <div class="sale-info">
        <div class="sale-name">${s.name}</div>
        <div class="sale-meta">床位：${s.beds} 张 · 今日接待：${s.received} 位</div>
      </div>
      ${badge}`;
    container.appendChild(card);
  });

  // 同步管理面板（若已打开）
  renderMgrList();
}

function renderLog() {
  const container = document.getElementById("log-list");
  if (!logItems.length) {
    container.innerHTML = '<div class="log-empty">暂无记录</div>';
    return;
  }
  container.innerHTML = logItems.map(item =>
    `<div class="log-item"><span>${item.name}</span><span>${item.time}</span></div>`
  ).join("");
}

function renderMgrList() {
  const container = document.getElementById("mgr-list");
  if (!container) return;
  const list = sorted();
  container.innerHTML = list.map(s => `
    <div class="sale-mgr-item">
      <span class="sale-mgr-name">${s.name}</span>
      <div class="beds-ctrl">
        <button onclick="adjustBeds('${s.key}',-1)">－</button>
        <span>${s.beds}</span>
        <button onclick="adjustBeds('${s.key}',1)">＋</button>
      </div>
      <button class="btn-danger" style="padding:4px 10px;border-radius:8px;border:none;font-size:13px;cursor:pointer;margin-left:6px;"
        onclick="removeSale('${s.key}','${s.name}')">删除</button>
      <button style="padding:4px 10px;border-radius:8px;border:1px solid #ddd;background:#fff;font-size:13px;cursor:pointer;margin-left:4px;"
        onclick="toggleRest('${s.key}','${s.resting}')">
        ${s.resting ? "上班" : "休息"}
      </button>
    </div>`).join("");
}

// ── 操作 ──────────────────────────────────────────────
function receiveCustomer() {
  const next = nextActive();
  if (!next) { toast("没有可接待的销售人员"); return; }
  const now = new Date();
  const timeStr = now.toTimeString().slice(0, 5);
  const updates = {};
  updates["sales/" + next.key + "/received"] = (next.received || 0) + 1;
  updates["log/" + todayStr() + "/" + Date.now()] = { name: next.name, time: timeStr };
  db.ref().update(updates).catch(() => toast("写入失败，请检查网络"));
  toast(`已记录：${next.name} 接待客户`);
}

function toggleRest(key, curResting) {
  db.ref("sales/" + key + "/resting").set(curResting === "true" || curResting === true ? false : true);
}

function adjustBeds(key, delta) {
  const cur = sales[key] ? (sales[key].beds || 0) : 0;
  const newVal = Math.max(0, cur + delta);
  db.ref("sales/" + key + "/beds").set(newVal);
}

function addSale() {
  const name = document.getElementById("new-name").value.trim();
  const beds = parseInt(document.getElementById("new-beds").value) || 0;
  if (!name) { toast("请填写姓名"); return; }
  const newKey = "s" + Date.now();
  db.ref("sales/" + newKey).set({ name, beds, received: 0, resting: false });
  document.getElementById("new-name").value = "";
  document.getElementById("new-beds").value = "";
  toast(`已添加：${name}`);
}

function removeSale(key, name) {
  if (!confirm(`确定删除 ${name}？`)) return;
  db.ref("sales/" + key).remove();
  toast(`已删除：${name}`);
}

function resetDaily() {
  if (!confirm("确定重置今日所有人的接待次数？")) return;
  const updates = {};
  Object.keys(sales).forEach(k => { updates["sales/" + k + "/received"] = 0; });
  updates["config/date"] = todayStr();
  db.ref().update(updates);
  toast("已重置今日接待次数");
}

function changePwd() {
  const np = document.getElementById("new-pwd").value.trim();
  if (!np) { toast("密码不能为空"); return; }
  db.ref("config/pwd").set(np);
  document.getElementById("new-pwd").value = "";
  toast("密码已修改");
}

// ── 密码弹窗 ──────────────────────────────────────────
function openPwd() {
  if (adminUnlocked) { openAdmin(); return; }
  document.getElementById("pwd-modal").classList.add("open");
  document.getElementById("pwd-input").value = "";
  setTimeout(() => document.getElementById("pwd-input").focus(), 100);
}
function closePwd() {
  document.getElementById("pwd-modal").classList.remove("open");
}
function checkPwd() {
  const val = document.getElementById("pwd-input").value;
  if (val === adminPwd) {
    adminUnlocked = true;
    closePwd();
    openAdmin();
  } else {
    toast("密码错误");
    document.getElementById("pwd-input").value = "";
  }
}
document.getElementById("pwd-input").addEventListener("keydown", e => {
  if (e.key === "Enter") checkPwd();
});

// ── 管理面板 ──────────────────────────────────────────
function openAdmin() {
  renderMgrList();
  document.getElementById("admin-modal").classList.add("open");
}
function closeAdmin() {
  document.getElementById("admin-modal").classList.remove("open");
}
document.getElementById("admin-modal").addEventListener("click", e => {
  if (e.target === document.getElementById("admin-modal")) closeAdmin();
});

// ── 设置页 ────────────────────────────────────────────
function saveDbUrl() {
  const url = document.getElementById("db-url-input").value.trim();
  if (!url || !url.startsWith("https://")) {
    toast("请输入正确的数据库 URL（https://...）");
    return;
  }
  localStorage.setItem("fb_db_url", url);
  startApp(url);
}

function startApp(dbUrl) {
  document.getElementById("setup-page").style.display = "none";
  document.getElementById("main-page").style.display = "flex";
  initFirebase(dbUrl);
}

// ── 启动 ──────────────────────────────────────────────
const savedUrl = localStorage.getItem("fb_db_url");
if (savedUrl) {
  startApp(savedUrl);
} else {
  document.getElementById("setup-page").style.display = "flex";
}
</script>
</body>
</html>
